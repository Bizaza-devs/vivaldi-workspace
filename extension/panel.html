<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="bar">
  <div class="title"><span class="logo" aria-hidden="true"></span>Gemini</div>
  <select id="route" class="pill" title="Model choice" aria-label="Model choice">
    <option value="auto">Auto</option>
    <option value="fast">Fast</option>
    <option value="strong">Strong</option>
  </select>
  <button id="newChat" class="icon" title="New chat" aria-label="New chat">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </button>
  <button id="openSettings" class="icon" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
  </button>
</header>

<main id="chat">
  <div id="messages" aria-live="polite"></div>
  <section id="empty" class="empty">
    <div class="orb" aria-hidden="true"></div>
    <h1>How can I help?</h1>
    <div class="chips">
      <button data-page="1" data-prompt="Summarise this page briefly as bullet points.">Summarise page</button>
      <button data-page="1" data-prompt="What are the key takeaways on this page?">Key points</button>
      <button data-prompt="Write 3 short, punchy Instagram caption ideas for a streetwear drop.">Caption ideas</button>
    </div>
  </section>
</main>

<footer class="composer">
  <div id="ctx" class="ctx" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></svg>
    <span class="ctx-label"></span>
    <button class="ctx-x" title="Remove" aria-label="Remove context">×</button>
  </div>
  <div class="box">
    <button id="attach" class="icon" title="Attach the current page" aria-label="Attach page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Ask anything…" aria-label="Message"></textarea>
    <button id="send" class="send" title="Send (Enter)" aria-label="Send">
      <svg class="i-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
    </button>
  </div>
  <p id="privacy" class="hint" hidden>Free key: Google may use what you send. Do not attach sensitive pages.</p>
</footer>

<section id="settings" class="sheet" hidden aria-label="Settings">
  <header class="bar">
    <div class="title">Settings</div>
    <button id="closeSettings" class="done">Done</button>
  </header>
  <div class="form">
    <div class="group">
      <label class="label" for="apiKey">Gemini API key</label>
      <div class="row">
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…">
        <button id="toggleKey" class="ghost" type="button">Show</button>
      </div>
      <p class="help">Create a key: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">aistudio.google.com/apikey</a>. It stays on this computer, in the browser's local storage.</p>
    </div>
    <button id="loadModels" class="primary" type="button">Check key and load models</button>
    <p id="modelStatus" class="help"></p>

    <div class="group">
      <label class="label" for="fastModel">Fast model – short questions</label>
      <select id="fastModel"></select>
    </div>
    <div class="group">
      <label class="label" for="strongModel">Strong model – work, analysis, code</label>
      <select id="strongModel"></select>
    </div>
    <div class="group">
      <label class="label" for="openMode">Open from the icon / Alt+G</label>
      <select id="openMode">
        <option value="window">Small separate window (always works in Vivaldi)</option>
        <option value="sidepanel">Side panel (Chrome-style)</option>
      </select>
    </div>
    <label class="check"><input id="freeTier" type="checkbox"><span>I use a free key – show a warning and use Flash as the strong model too</span></label>
    <div class="group">
      <label class="label" for="system">System instruction</label>
      <textarea id="system" rows="4"></textarea>
    </div>
    <button id="clearChat" class="danger" type="button">Clear chat</button>
    <p class="help">Vivaldi web panel URL: <code id="panelUrl">–</code></p>
  </div>
</section>

<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="panel.js"></script>
</body>
</html>
